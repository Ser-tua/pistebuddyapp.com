<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PisteBuddy</title>
<meta name="description" content="Ski and snowboard navigation for iPhone and Android. Register your interest.">
<link rel="icon" href="/get-assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700&family=Host+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<!-- TEMPORARY (2026-10-17, Brad): the flyer's own picture with a "register interest" box, while the
     app is in App Store review. Revert this commit at launch, when config.js gets the store URLs.
     The redirect below is unchanged: a phone whose store is live never sees this page.
     Hero = the flyer PDF cropped to x 227..1020, y 0..1450 pt; logo = its bottom-left lockup. -->
<style>
  :root {
    --violet: #8780D4; --violet-dark: #766FBD; --violet-tint: #EDECF8;
    --card: #FFFFFF; --bg: #FFFFFF; --ink: #3F3F3F; --muted: #8E8C9C; --line: #E7E7E7;
    --display: "Host Grotesk", "Albert Sans", system-ui, sans-serif;
    --body: "Albert Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light only; }
  html.redirecting body { visibility: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
  /* ONE SCREEN: the picture is cropped from the top (sky) just enough that the phone outline's
     bottom edge, at 80.7% of the picture (147.5% of its width), lands right above the box and the box
     ends at the bottom of the screen. cqw = 1% of the page's width, so this holds on desktop too. */
  .page { position: relative; max-width: 480px; margin: 0 auto; container-type: inline-size; overflow: hidden;
          --boxh: 262px; --gap: 10px; min-height: 100svh; }
  .hero { display: block; width: 100%; height: auto;
          margin-top: clamp(-130px, calc(100svh - var(--boxh) - var(--gap) - 16px - 147.5cqw), 0px);
          -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  .box { position: relative; margin: calc(var(--gap) - 35.3cqw) 16px 16px; background: var(--card); border-radius: 26px;
         padding: 18px 20px 14px; box-shadow: 0 4px 40px rgba(40, 70, 110, .18); text-align: center; }
  .logo { display: block; width: 148px; height: auto; margin: 0 auto 8px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input[type=email] { width: 100%; font: 16px var(--body); color: var(--ink); background: #fff;
       border: 1px solid var(--line); border-radius: 24px; padding: 11px 16px; text-align: center; }
  input[type=email]:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-tint); }
  button { font: 500 16px var(--display); color: #fff; background: var(--violet); border: 0;
       border-radius: 24px; padding: 12px 16px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .msg { font-size: 14px; margin: 8px 0 0; color: #C0392B; }
  .done { background: var(--violet-tint); color: var(--violet-dark); border-radius: 20px; padding: 14px;
          font-weight: 500; margin: 0; }
  .privacy { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
  /* Entrance: the box fades up once the picture is there. */
  @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  .box { animation: rise .8s cubic-bezier(.2, .8, .2, 1) .2s both; }
  /* Pearlescence on the violets: a slow iridescent sheen laid over the violet, never replacing it. */
  @keyframes pearl { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  .pearl { position: relative; isolation: isolate; overflow: hidden; }
  .pearl::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 10%, rgba(255,214,245,.55) 30%, rgba(190,236,255,.6) 42%,
                rgba(255,255,255,.75) 50%, rgba(214,200,255,.55) 60%, rgba(255,226,206,.45) 72%, rgba(255,255,255,0) 90%);
    background-size: 300% 100%; mix-blend-mode: soft-light; animation: pearl 16s ease-in-out infinite alternate; }
  /* The button needs a stronger sheen than the tile to read on a large flat violet. */
  button.pearl::after { mix-blend-mode: normal; opacity: .55;
    background: linear-gradient(115deg, rgba(255,255,255,0) 20%, rgba(255,190,240,.55) 34%, rgba(170,230,255,.65) 44%,
                rgba(255,255,255,.85) 50%, rgba(200,185,255,.6) 57%, rgba(255,215,190,.5) 66%, rgba(255,255,255,0) 80%);
    background-size: 250% 100%; animation-duration: 12s; }
  button.pearl > span { position: relative; z-index: 1; }
  .logo-wrap { position: relative; width: 148px; margin: 0 auto 8px; }
  .logo-wrap .logo { margin: 0; }
  /* The violet tile in the lockup: x 2.4..32.7%, y 6.8..92.9% of the image, corners ~8px. */
  .logo-wrap .tile { position: absolute; left: 2.4%; width: 30.3%; top: 6.8%; height: 86.1%; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .box, .pearl::after { animation: none; } }
  a { color: var(--violet-dark); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>
<script src="/get-assets/config.js"></script>
<script src="/get-assets/platform.js"></script>
<script>
  // Decided here, in <head>, before the page is drawn: a phone whose store is live never sees it.
  (function () {
    var d;
    try {
      d = PBGet.decide(
        { userAgent: navigator.userAgent, platform: navigator.platform, maxTouchPoints: navigator.maxTouchPoints },
        PB_GET_CONFIG,
        location.search
      );
    } catch (e) { return; }
    window.PB_GET_DECISION = d;
    if (d.action === 'redirect') {
      document.documentElement.className = 'redirecting';
      location.replace(d.url);
      setTimeout(function () { document.documentElement.className = ''; }, 2500);
    }
  })();
</script>
</head>
<body>
<div class="page">
  <img class="hero" src="/get-assets/hero.jpg" width="1269" height="2320"
       alt="A skier above a snowy valley, with PisteBuddy's map pins drawn over the view. Mountains, mapped.">
  <section class="box" id="box">
    <div class="logo-wrap"><img class="logo" src="/get-assets/logo-lockup.png" alt="PisteBuddy" width="840" height="296"><span class="tile pearl" aria-hidden="true"></span></div>
    <p class="sub">Registration of interest. No spam, no newsletters.</p>
    <form id="form" novalidate>
      <label class="hp" aria-hidden="true">Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      <input type="email" name="email" id="email" placeholder="Email address" autocomplete="email"
             inputmode="email" required aria-label="Email address">
      <button type="submit" id="btn" class="pearl"><span id="btn-label">Register interest</span></button>
    </form>
    <p class="msg" id="msg" role="status" hidden></p>
    <p class="privacy">Only used to tell you when we launch. <a href="https://pistebuddy.online/privacy/">Privacy Policy</a></p>
  </section>
</div>
<script>
  (function () {
    var box = document.getElementById('box'), form = document.getElementById('form');
    var btn = document.getElementById('btn'), msg = document.getElementById('msg'), input = document.getElementById('email');
    var EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    var thanks = function () { form.outerHTML = '<p class="done">Thanks, you’re on the list.</p>'; msg.hidden = true; };
    var say = function (t) { msg.textContent = t; msg.hidden = false; };
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (form.website.value) { thanks(); return; } // a bot filled the hidden field
      var email = input.value.trim();
      if (!EMAIL.test(email)) { say('Please enter a valid email address.'); return; }
      btn.disabled = true; document.getElementById('btn-label').textContent = 'Sending…'; msg.hidden = true;
      var src = (window.PBGet && PBGet.campaign(location.search)) || null;
      fetch('https://eakfweipboojkhlpgydk.supabase.co/rest/v1/rpc/join_launch_list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_TQGqabujfco4jZbwFlVxEA_ywlHL6bi', Authorization: 'Bearer sb_publishable_TQGqabujfco4jZbwFlVxEA_ywlHL6bi' },
        body: JSON.stringify({ p_email: email, p_src: src })
      }).then(function (r) {
        if (r.ok) { thanks(); return; }
        return r.json().catch(function () { return {}; }).then(function (j) {
          throw new Error(/invalid_email/.test((j && j.message) || '') ? 'Please enter a valid email address.' : 'Something went wrong. Please try again.');
        });
      }).catch(function (err) {
        btn.disabled = false; document.getElementById('btn-label').textContent = 'Register interest';
        say(err && /email|wrong/.test(err.message || '') ? err.message : 'No connection. Please try again.');
      });
    });
  })();
</script>
</body>
</html>
