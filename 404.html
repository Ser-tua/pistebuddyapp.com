<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in PisteBuddy</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0F1012; color: #F2F2F2; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 480px; text-align: center; }
  h1 { color: #8780D4; margin: 0 0 12px; font-size: 22px; }
  p { line-height: 1.5; }
  .stores { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .stores a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #8780D4; color: #0F1012; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Open in PisteBuddy</h1>
  <p>If PisteBuddy is installed this link opens it. Otherwise get the app:</p>
  <div class="stores">
    <!-- Placeholders: no App Store / Play Store listing exists yet. Point both at the
         site root until the real listings are live, then swap in the store URLs. -->
    <a href="https://pistebuddyapp.com">App Store</a>
    <a href="https://pistebuddyapp.com">Google Play</a>
  </div>
</main>
<script>
  // Belt-and-braces fallback for devices where Android App Link verification
  // failed (so the OS opened this page in a browser instead of the app
  // directly). Only fire when there is actually a token in the path — an
  // empty /add/ has nothing to hand the app.
  (function () {
    var token = location.pathname.split('/add/')[1];
    if (token) {
      setTimeout(function () {
        location.replace('pistebuddy://add/' + token);
      }, 300);
    }
  })();
</script>
</body>
</html>
